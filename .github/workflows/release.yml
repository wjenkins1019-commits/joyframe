# Packages the Windows installer and stages it on a *draft* release, so the
# download button never points at an unproven build. Manual runs stage the
# current package version; a v* tag does the same for that tag. A second
# job then downloads that draft asset, checks its bytes against the release
# digest, installs it silently and boots the installed copy — and only when
# that proof passes does a third job flip the draft to published. A corrupt
# upload or installer-only regression therefore fails the workflow while
# the release is still invisible, instead of shipping quietly.
#
# The installer is signed with Azure Artifact Signing only when the Azure
# secrets exist (see the "Enable Azure signing" step). With no secrets the
# step exits quietly and the build stays unsigned, so forks, local runs and
# the period before the signing account exists all keep working. Nothing
# here buys or provisions anything: creating the Trusted Signing account,
# certificate profile and app registration, then adding these repo secrets,
# is what turns signing on:
# AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET (Entra app +
# "Trusted Signing Certificate Profile Signer" role), AZURE_SIGNING_ENDPOINT
# (regional, e.g. eus.codesigning.azure.net/), AZURE_SIGNING_ACCOUNT,
# AZURE_SIGNING_PROFILE, AZURE_PUBLISHER_NAME (must exactly match the
# certificate's CN).
#
# Beta channel: a package version with a semver prerelease suffix (e.g.
# `1.0.2-beta.0`, tag `v1.0.2-beta.0`) is staged as a GitHub *prerelease*
# carrying both `latest.yml` and a `<channel>.yml` copy (`beta.yml`).
# electron-updater on a prerelease install opts into prereleases and reads
# the channel manifest from the newest matching prerelease tag, while stable
# installs resolve through GitHub's `releases/latest` endpoint — which
# ignores prereleases — so beta builds prove the updater on real installs
# without stable users ever seeing them. The tag guard below applies
# unchanged: the tag must still be exactly `v<package version>`.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      # Fail-fast integrity gate: on a tag push the tag must be exactly
      # v<package.json version>, otherwise the run would publish bytes built
      # from a mismatched version under the tag's name. Runs before any
      # build work so a bad tag dies in seconds. Manual dispatches carry no
      # tag, so they only report the version they are about to stage.
      - name: Guard tag matches package version
        shell: bash
        run: |
          pkg="$(node -p "require('./package.json').version")"
          ref="${{ github.ref }}"
          if [[ "$ref" == refs/tags/* ]]; then
            tag="${ref#refs/tags/}"
            if [[ "$tag" != "v$pkg" ]]; then
              echo "::error::Tag $tag does not match package.json version $pkg — refusing to publish mismatched bytes. Move the tag or bump the version."
              exit 1
            fi
            echo "tag $tag matches package version $pkg"
          else
            echo "no tag ($ref); staging package version $pkg as a draft"
          fi

      - name: Install dependencies
        run: npm ci

      # No `if:` gate: the script itself enables signing only when the
      # Azure secrets are present and fails loudly on a half-configured
      # setup, so an unsigned build never pretends to be signed.
      - name: Enable Azure signing when configured
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
        run: node scripts/enable-azure-signing.mjs

      - name: Build installer
        shell: bash
        env:
          # Consumed by electron-builder's Azure signing backend only when
          # the step above enabled it; harmlessly ignored for unsigned builds.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: npm run dist > dist.log 2>&1

      - name: Verify installer
        run: npm run verify:installer

      # Derives the release kind from the version string: a hyphen means a
      # semver prerelease, and its first identifier is the update channel
      # (`1.0.2-beta.0` → channel `beta`, manifest `beta.yml`) — the same rule
      # electron-updater applies when the installed app picks its channel
      # file, so the workflow can never stage a manifest the updater will not
      # read. Stable versions stay on `latest.yml`, exactly as before.
      - name: Read package version
        id: pkg
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            channel="${version#*-}"
            channel="${channel%%.*}"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            channel="latest"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "manifest=$channel.yml" >> "$GITHUB_OUTPUT"
          echo "version $version → channel $channel"

      # The builder always emits `latest.yml`; a prerelease additionally
      # publishes the channel manifest (`beta.yml`) — a byte copy, so both
      # manifests advertise the same proven build. The beta updater reads the
      # channel file first and only falls back to `latest.yml`, so the copy
      # is what makes the channel explicit instead of relying on the 404
      # fallback on every check.
      - name: Prepare beta channel manifest
        if: steps.pkg.outputs.prerelease == 'true'
        shell: bash
        run: |
          cp "release/latest.yml" "release/${{ steps.pkg.outputs.manifest }}"
          echo "channel manifest release/${{ steps.pkg.outputs.manifest }} prepared"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: JOYFRAME-Setup-${{ steps.pkg.outputs.version }}
          path: release/JOYFRAME Setup ${{ steps.pkg.outputs.version }}.exe
          if-no-files-found: error

      # Staged as a draft, never public yet: `draft: true` must stay set on
      # every run (including re-runs on an existing tag) so new bytes always
      # land invisible. The promote-release job below is the only step that
      # makes a release public, and it runs only after verify-published.
      # Promotion uses `gh release edit`, not this action: the action cannot
      # flip a draft to published (it would create a second release).
      # `latest.yml` is the update manifest electron-updater reads: without
      # it the installed app can never discover this release, so it ships as
      # a required asset next to the installer (and the unmatched-files flag
      # fails the run if the build did not emit it). A prerelease version
      # additionally stages the channel manifest (`beta.yml`) and is marked
      # `prerelease: true`: GitHub's `releases/latest` endpoint ignores
      # prereleases, so stable updaters never see these builds, while
      # prerelease installs read the channel file and prove the update path
      # before stable ships.
      - name: Stage GitHub release as draft (stable)
        if: steps.pkg.outputs.prerelease == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: JOYFRAME v${{ steps.pkg.outputs.version }}
          files: |
            release/JOYFRAME Setup ${{ steps.pkg.outputs.version }}.exe
            release/latest.yml
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true
          prerelease: false

      - name: Stage GitHub release as draft (beta)
        if: steps.pkg.outputs.prerelease == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: JOYFRAME v${{ steps.pkg.outputs.version }}
          files: |
            release/JOYFRAME Setup ${{ steps.pkg.outputs.version }}.exe
            release/latest.yml
            release/${{ steps.pkg.outputs.manifest }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true
          prerelease: true

  # Proves the bytes users will download are the ones the draft staged. The
  # installer job above tests the local package; this job tests the upload:
  # it resolves the draft release by tag, downloads the exe GitHub serves
  # (drafts are readable with the job token), fails when its size or SHA-256
  # differs from the release digest, installs it the way a release machine
  # does (`/allusers /S`), then runs the installed boot probe. It runs only
  # the boot probe (`verify-installed.mjs`) rather than
  # `npm run verify:installed`, because there is no local
  # release/win-unpacked here to compare against — the digest check above is
  # the byte comparison for this job.
  verify-published:
    name: Published installer installs and boots
    runs-on: windows-latest
    needs: [windows-installer]
    timeout-minutes: 15
    permissions:
      # Draft releases are invisible to a read-only token through the
      # `releases/tags/*` endpoint, so a new prerelease tag (which has only a
      # draft) 404s there while a re-run on an already-published stable tag
      # succeeds. Write is the least privilege that can read the draft this
      # job must prove before promote-release makes it public.
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The boot probe imports only `node:` modules and sibling helpers, so
      # no `npm ci` (and no Electron download) is needed to run it.
      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Read package version
        id: pkg
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Download the published installer and check its digest
        id: download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.pkg.outputs.version }}'
          $tag = "v$version"
          Write-Host "resolving release $tag"

          $release = $null
          for ($i = 1; $i -le 12; $i++) {
            try {
              $release = gh api "repos/${{ github.repository }}/releases?per_page=100" --jq "[.[] | select(.tag_name == `"$tag`")][0] | {id, tag_name, draft, prerelease, assets: [.assets[] | {name, label, digest, size}]}" | ConvertFrom-Json
              if ($release -and $release.assets -and $release.assets.Count -gt 0) { break }
              Write-Host "attempt ${i}: release $tag not staged with assets yet"
            } catch {
              Write-Host "attempt ${i}: release not ready yet ($($_.Exception.Message))"
            }
            Start-Sleep -Seconds 5
          }
          if (-not $release -or -not $release.assets -or $release.assets.Count -eq 0) {
            throw "release $tag has no assets — the publish step uploaded none"
          }

          $asset = $release.assets | Where-Object { $_.name -like 'JOYFRAME.Setup.*.exe' -or $_.label -like 'JOYFRAME Setup *.exe' } | Select-Object -First 1
          if (-not $asset) { throw "release $tag holds no JOYFRAME Setup exe (saw: $($release.assets.name -join ', '))" }
          if (-not $asset.digest) { throw "release asset $($asset.name) carries no digest to check against" }
          $expectedHash = ($asset.digest -replace '^sha256:', '').ToUpperInvariant()
          $expectedSize = [long]$asset.size
          Write-Host "expecting $($asset.name) ($expectedSize bytes, sha256 $expectedHash)"

          New-Item -ItemType Directory -Force published | Out-Null
          gh release download "$tag" --repo "${{ github.repository }}" --pattern '*.exe' --dir published --clobber
          $installer = Get-ChildItem published -Filter 'JOYFRAME Setup *.exe' | Select-Object -First 1
          if (-not $installer) { $installer = Get-ChildItem published -Filter '*.exe' | Select-Object -First 1 }
          if (-not $installer) { throw 'the release download left no exe in published/' }
          Write-Host "downloaded $($installer.Name) ($($installer.Length) bytes)"
          if ($installer.Length -ne $expectedSize) {
            throw "size mismatch: downloaded $($installer.Length) bytes, release says $expectedSize"
          }
          $actualHash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToUpperInvariant()
          Write-Host "sha256 $actualHash"
          if ($actualHash -ne $expectedHash) {
            throw "hash mismatch: downloaded $actualHash, release digest $expectedHash"
          }
          Write-Host "published installer matches its release digest"
          echo "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT

          gh release download "$tag" --repo "${{ github.repository }}" --pattern '*.yml' --dir published --clobber
          $manifest = Get-ChildItem published -Filter 'latest.yml' | Select-Object -First 1
          if (-not $manifest) { throw 'release holds no latest.yml — auto-update has nothing to read' }
          $manifestText = Get-Content $manifest.FullName -Raw
          if ($manifestText -notmatch '(?m)^version:\s*(\S+)') { throw 'latest.yml has no version line' }
          $manifestVersion = $Matches[1]
          if ($manifestVersion -ne $version) { throw "latest.yml advertises $manifestVersion, expected $version" }
          Write-Host "latest.yml advertises version $manifestVersion"

          # Prereleases must carry the channel manifest the beta updater reads
          # first (`beta.yml` for `1.0.2-beta.0`): without it every beta check
          # still resolves through the 404 fallback, and a missing file here
          # means the draft staged the wrong assets. The channel is the first
          # prerelease identifier — the same rule electron-updater applies.
          if ($version -like '*-*') {
            $channel = (($version -split '-', 2)[1] -split '\.')[0]
            $channelFile = "$channel.yml"
            $channelManifest = Get-ChildItem published -Filter $channelFile | Select-Object -First 1
            if (-not $channelManifest) { throw "prerelease $version holds no $channelFile — the beta channel has nothing to read" }
            $channelText = Get-Content $channelManifest.FullName -Raw
            if ($channelText -notmatch '(?m)^version:\s*(\S+)') { throw "$channelFile has no version line" }
            if ($Matches[1] -ne $version) { throw "$channelFile advertises $($Matches[1]), expected $version" }
            Write-Host "$channelFile advertises version $version"
          }

      # Signed download-to-restart needs a Valid Authenticode signature on both
      # the downloaded installer and the installed exe: electron-updater refuses
      # unsigned downloads and updates.ts skips the check on unsigned installs.
      # Unsigned betas stay green here (log + pass); when the Azure secrets are
      # present the build was supposed to sign, so --require-signed fails loudly
      # instead of letting an unsigned "signed" beta through to promote.
      - name: Verify installer signature (signed path when enabled)
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $installer = '${{ steps.download.outputs.installer }}'
          if (-not $installer -or -not (Test-Path $installer)) {
            $installer = (Get-ChildItem published -Filter '*.exe' | Select-Object -First 1).FullName
          }
          if (-not $installer) { throw 'published/ holds no installer — the download step produced none' }
          $require = $env:AZURE_TENANT_ID -and $env:AZURE_CLIENT_ID -and $env:AZURE_CLIENT_SECRET
          if ($require) { node scripts/verify-signature.mjs "$installer" --require-signed }
          else { node scripts/verify-signature.mjs "$installer" }

      - name: Install it silently, the way a release machine does
        id: install
        shell: pwsh
        timeout-minutes: 5
        run: |
          $installer = '${{ steps.download.outputs.installer }}'
          if (-not $installer -or -not (Test-Path $installer)) {
            $installer = (Get-ChildItem published -Filter '*.exe' | Select-Object -First 1).FullName
          }
          if (-not $installer) { throw 'published/ holds no installer — the download step produced none' }
          Write-Host "installing $installer"
          $result = Start-Process -FilePath $installer -ArgumentList '/allusers', '/S' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "$installer exited $($result.ExitCode)" }
          # A silent assisted install can still honour its run-after-finish box.
          # Stop that copy so the probe's own launch owns its profile.
          Get-Process JOYFRAME -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = 'C:\Program Files\JOYFRAME\JOYFRAME.exe'
          $deadline = (Get-Date).AddSeconds(60)
          while (-not (Test-Path $exe) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path $exe)) { throw "the installer left no $exe" }
          Write-Host "installed $exe"

      - name: Verify installed exe signature (signed path when enabled)
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $exe = 'C:\Program Files\JOYFRAME\JOYFRAME.exe'
          $require = $env:AZURE_TENANT_ID -and $env:AZURE_CLIENT_ID -and $env:AZURE_CLIENT_SECRET
          if ($require) { node scripts/verify-signature.mjs "$exe" --require-signed }
          else { node scripts/verify-signature.mjs "$exe" }

      # Byte equality is already proven by the digest check above; this is the
      # boot half: the installed copy must show its ident, skip it on a key
      # press without click-through, and honour `introMode: off` on a cold
      # first launch.
      - name: Installed app — published copy boots
        id: installed
        timeout-minutes: 5
        run: node scripts/verify-installed.mjs

      - name: Upload published-copy artifacts
        if: failure() && steps.installed.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: published-copy-artifacts-attempt-${{ github.run_attempt }}
          path: |
            .verify-logs/verify-installed.log
            .verify-intro
          if-no-files-found: warn
          # Both paths live under dot-directories, which upload-artifact skips
          # unless this is on.
          include-hidden-files: true

  # Makes the draft public — and only runs when verify-published passed, so
  # a bad build can fail the workflow while still invisible. `needs` gives
  # the ordering: a failed or skipped verify means this job never runs.
  promote-release:
    name: Promote verified draft to published
    runs-on: ubuntu-latest
    needs: [verify-published]
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish the verified draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          # verify-published passed, so the draft at this tag holds the proven
          # bytes — flipping it public is the last step, never the first.
          # `--draft=false` leaves the prerelease flag untouched, so a beta
          # stays a prerelease (invisible to stable updaters) once published.
          gh release edit "$tag" --repo "${{ github.repository }}" --draft=false
          echo "release $tag is now published"
