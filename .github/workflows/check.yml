# The suite only proves anything if it runs. `npm run check` needs a human to
# remember it — and the guard self-test exists precisely because guards that are
# exercised by hand once, then never again, rot silently.
#
# The no-GUI job typechecks, proves the suite's own guards still fail correctly,
# exercises the packaged-freshness guard with real fixture archives, and runs
# the backend smoke test against real fixtures.
#
# The controller job boots Electron and drives the renderer over the DevTools
# protocol with a virtual pad. windows-latest provides an interactive desktop
# session, so those probes do not need a self-hosted runner. This is the job
# that holds the game page's back-button checks, which is why it cannot stay a
# local-only command. The installer job builds the package and then runs the
# same controller suite against the packaged exe, so CI covers the asar payload
# and not only dev Electron. The separate packaged profiles in `verify:dist` and
# `verify:first-run` run here too; probes that need an installed copy still run
# through `npm run certify` on a machine that has one.
#
# Node is pinned to the version the suite is proven on (26): the services use
# `node:sqlite` and the probes use the built-in `WebSocket`, both of which a
# contributor on an older Node would only discover as a crash mid-run.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: nothing here publishes, packages or writes to the repository.
permissions:
  contents: read

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-gui-checks:
    name: typecheck, guard self-test, freshness, smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      # Runs the project's postinstall, which installs Electron's binary. None of
      # the steps below launch it, but skipping it would make CI differ from the
      # machine a developer runs on for no gain worth the divergence.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck main and renderer
        run: npm run typecheck

      - name: Prove the suite's guards still fail correctly
        run: npm run self-test

      - name: Exercise the packaged-freshness guard
        run: npm run verify:freshness

      - name: Backend smoke test
        run: npm run smoke

  # The controller suite is the only coverage of the game page's back button:
  # the page has to appear without moving, and one immediate click has to close
  # it. Both are regressions that shipped once, so the suite runs on every push
  # instead of only when someone remembers `npm run verify:pad`.
  controller-checks:
    name: controller suite (virtual gamepad)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Builds out/ itself, seeds a throwaway profile, then drives the real
      # renderer with a fake standard-mapping pad and real DevTools input.
      - name: Controller suite
        id: controller
        env:
          # The probe prints this name into the failure summary; the upload
          # below uses the same name.
          JF_FAILURE_ARTIFACTS: controller-suite-dev-artifacts-attempt-${{ github.run_attempt }}
        run: npm run verify:pad

      # The suite's screenshots and the app's own output are the evidence a red
      # run needs; without them the only way to see either is to run it again.
      - name: Upload controller screenshots and app log
        if: failure() && steps.controller.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: controller-suite-dev-artifacts-attempt-${{ github.run_attempt }}
          path: |
            .verify-shots
            .verify-logs/verify-pad.log
          if-no-files-found: warn
          # The screenshots live under a dot-directory, which upload-artifact
          # skips unless this is on.
          include-hidden-files: true

  # `npm run dist` is the only step that proves the tracked brand assets reach a
  # real package, and nothing in CI ran it — so a clean checkout could package
  # the default Electron icon while every other job stayed green. It is a later
  # stage than the checks above: a package made from a tree that failed them
  # says nothing worth trusting, so this waits for them. Once the package exists,
  # the controller suite runs against release/win-unpacked, so the shipped exe
  # is exercised too.
  installer:
    name: installer built from the project's icons
    runs-on: windows-latest
    needs: [no-gui-checks, controller-checks]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The log is the only place electron-builder admits it substituted the
      # fallback icon, so keep its exit status through the pipe and save it.
      - name: Build the Windows installer
        id: build
        shell: bash
        run: |
          set -o pipefail
          npm run dist 2>&1 | tee dist.log

      # A step timeout fails just that probe while the job keeps running, so
      # its failure uploads still run; a job timeout would end the job first.
      # The workflow self-test keeps their total inside the job budget.
      - name: Prove the installer used the project icon
        timeout-minutes: 2
        env:
          # The probe prints this name into the failure summary; the upload at
          # the end of the job uses the same name.
          JF_FAILURE_ARTIFACTS: installer-build-log-attempt-${{ github.run_attempt }}
        run: npm run verify:installer

      # Uses the package built above: seeds a throwaway profile, drives
      # release/win-unpacked/JOYFRAME.exe with the virtual pad, and refuses to
      # run unless the asar matches the current out/.
      - name: Controller suite against the packaged build
        id: packaged-controller
        timeout-minutes: 5
        env:
          # Both artifacts this job uploads when the packaged suite fails.
          JF_FAILURE_ARTIFACTS: controller-suite-packaged-artifacts-attempt-${{ github.run_attempt }},installer-build-log-attempt-${{ github.run_attempt }}
        run: npm run verify:dist-pad

      - name: Upload packaged controller screenshots and app log
        if: failure() && steps.packaged-controller.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: controller-suite-packaged-artifacts-attempt-${{ github.run_attempt }}
          path: |
            .verify-shots
            .verify-logs/verify-dist-pad.log
          if-no-files-found: warn
          # The screenshots live under a dot-directory, which upload-artifact
          # skips unless this is on.
          include-hidden-files: true

      # The package from above is already fresh; these cover its demo and ROM
      # payloads, the 1.0.0 upgrade path and a clean first launch without
      # another build.
      - name: Packaged app — demo, ROM and 1.0.0 profiles
        id: dist-profiles
        timeout-minutes: 5
        env:
          # Both artifacts this job uploads when the profile probe fails.
          JF_FAILURE_ARTIFACTS: dist-profiles-artifacts-attempt-${{ github.run_attempt }},installer-build-log-attempt-${{ github.run_attempt }}
        run: npm run verify:dist

      - name: Upload packaged profile artifacts
        if: failure() && steps.dist-profiles.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: dist-profiles-artifacts-attempt-${{ github.run_attempt }}
          path: .verify-logs/verify-dist.log
          if-no-files-found: warn
          include-hidden-files: true

      - name: Packaged app — first run
        id: first-run
        timeout-minutes: 3
        env:
          JF_FAILURE_ARTIFACTS: first-run-artifacts-attempt-${{ github.run_attempt }},installer-build-log-attempt-${{ github.run_attempt }}
        run: npm run verify:first-run

      - name: Upload first-run artifacts
        if: failure() && steps.first-run.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: first-run-artifacts-attempt-${{ github.run_attempt }}
          path: .verify-logs/verify-first-run.log
          if-no-files-found: warn
          include-hidden-files: true

      # Runs last on purpose: failure() here covers the build, the icon check
      # and every packaged suite, while an upload placed after the build
      # could never see the later ones. dist.log is their shared context.
      - name: Upload installer build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-build-log-attempt-${{ github.run_attempt }}
          path: dist.log
          if-no-files-found: warn
