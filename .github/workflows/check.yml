# The suite only proves anything if it runs. `npm run check` needs a human to
# remember it — and the guard self-test exists precisely because guards that are
# exercised by hand once, then never again, rot silently.
#
# The no-GUI job typechecks, proves the suite's own guards still fail correctly,
# exercises the packaged-freshness guard with real fixture archives, and runs
# the backend smoke test against real fixtures.
#
# The controller job boots Electron and drives the renderer over the DevTools
# protocol with a virtual pad, both for the game page and for the intro
# dropdown's controller path. windows-latest provides an interactive desktop
# session, so those probes do not need a self-hosted runner. This is the job
# that holds the game page's back-button checks, which is why it cannot stay a
# local-only command. The installer job builds the package and then runs the
# same controller suite against the packaged exe, so CI covers the asar payload
# and not only dev Electron. The separate packaged probes `verify:dist`,
# `verify:first-run` and `verify:intro-ui` run here too, so the intro dropdown's
# persistence is proven against the shipped payload rather than dev Electron.
#
# `verify:installed` was the one probe CI never ran: it looks at a machine-wide
# copy, so it needs an install, and an install nobody ran by hand left the
# shipped path unproven. The installer job now uploads the package it built and
# `installed-checks` installs that exact package silently (`/allusers /S`) and
# boots the installed copy — the hash against release/win-unpacked, the ident,
# the skip key without click-through and `introMode: off`.
#
# Node is pinned to the version the suite is proven on (26): the services use
# `node:sqlite` and the probes use the built-in `WebSocket`, both of which a
# contributor on an older Node would only discover as a crash mid-run.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: nothing here publishes, packages or writes to the repository.
permissions:
  contents: read

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-gui-checks:
    name: typecheck, guard self-test, freshness, smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      # Runs the project's postinstall, which installs Electron's binary. None of
      # the steps below launch it, but skipping it would make CI differ from the
      # machine a developer runs on for no gain worth the divergence.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck main and renderer
        run: npm run typecheck

      - name: Prove the suite's guards still fail correctly
        run: npm run self-test

      - name: Exercise the packaged-freshness guard
        run: npm run verify:freshness

      - name: Backend smoke test
        run: npm run smoke

      # Beta bytes must never reach users who did not opt in: the workflow has
      # to stage stable without a prerelease flag and beta with its channel
      # manifest, the updater has to pin the channel explicitly, and the live
      # releases have to honour it (releases/latest → stable with only
      # latest.yml, every prerelease carrying its <channel>.yml). Runs here so
      # every push proves the isolation, not just tag pushes.
      - name: Prove beta builds never reach stable users
        id: update-channels
        timeout-minutes: 3
        env:
          # The probe prints this name into the failure summary; the upload
          # below uses the same name.
          JF_FAILURE_ARTIFACTS: update-channels-artifacts-attempt-${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: npm run verify:update-channels

      - name: Upload update-channel artifacts
        if: failure() && steps.update-channels.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: update-channels-artifacts-attempt-${{ github.run_attempt }}
          path: .verify-logs/verify-update-channels.log
          if-no-files-found: warn
          include-hidden-files: true

  # The controller suite is the only coverage of the game page's back button:
  # the page has to appear without moving, and one immediate click has to close
  # it. Both are regressions that shipped once, so the suite runs on every push
  # instead of only when someone remembers `npm run verify:pad`.
  controller-checks:
    name: controller suite (virtual gamepad)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Builds out/ itself, seeds a throwaway profile, then drives the real
      # renderer with a fake standard-mapping pad and real DevTools input. A
      # step timeout fails the suite while the job keeps running, so the upload
      # below still gets the screenshots; a job timeout would skip it.
      - name: Controller suite
        id: controller
        timeout-minutes: 8
        env:
          # The probe prints this name into the failure summary; the upload
          # below uses the same name.
          JF_FAILURE_ARTIFACTS: controller-suite-dev-artifacts-attempt-${{ github.run_attempt }}
        run: npm run verify:pad

      # The suite's screenshots and the app's own output are the evidence a red
      # run needs; without them the only way to see either is to run it again.
      - name: Upload controller screenshots and app log
        if: failure() && steps.controller.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: controller-suite-dev-artifacts-attempt-${{ github.run_attempt }}
          path: |
            .verify-shots
            .verify-logs/verify-pad.log
          if-no-files-found: warn
          # The screenshots live under a dot-directory, which upload-artifact
          # skips unless this is on.
          include-hidden-files: true

      # The suite above drives the game page; nothing else reaches the Startup
      # intro dropdown with a controller alone, and `verify:intro-ui` uses mouse
      # and keyboard. It boots dev Electron, so it belongs here rather than in
      # the installer job, which has a package but no fresh dev build it owns.
      - name: Intro dropdown by controller
        id: intro-pad
        timeout-minutes: 3
        env:
          JF_FAILURE_ARTIFACTS: intro-pad-artifacts-attempt-${{ github.run_attempt }}
        run: npm run verify:intro-pad

      - name: Upload intro-pad artifacts
        if: failure() && steps.intro-pad.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: intro-pad-artifacts-attempt-${{ github.run_attempt }}
          path: .verify-logs/verify-intro-pad.log
          if-no-files-found: warn
          include-hidden-files: true

  # `npm run dist` is the only step that proves the tracked brand assets reach a
  # real package, and nothing in CI ran it — so a clean checkout could package
  # the default Electron icon while every other job stayed green. It is a later
  # stage than the checks above: a package made from a tree that failed them
  # says nothing worth trusting, so this waits for them. Once the package exists,
  # the controller suite runs against release/win-unpacked, so the shipped exe
  # is exercised too.
  installer:
    name: installer built from the project's icons
    runs-on: windows-latest
    needs: [no-gui-checks, controller-checks]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The log is the only place electron-builder admits it substituted the
      # fallback icon, so keep its exit status through the pipe and save it.
      - name: Build the Windows installer
        id: build
        shell: bash
        run: |
          set -o pipefail
          npm run dist 2>&1 | tee dist.log

      # A step timeout fails just that probe while the job keeps running, so
      # its failure uploads still run; a job timeout would end the job first.
      # The workflow self-test keeps their total inside the job budget.
      - name: Prove the installer used the project icon
        timeout-minutes: 2
        env:
          # The probe prints this name into the failure summary; the upload at
          # the end of the job uses the same name.
          JF_FAILURE_ARTIFACTS: installer-build-log-attempt-${{ github.run_attempt }}
        run: npm run verify:installer

      # `installed-checks` installs this package instead of building a second
      # one, so the bytes it verifies are the bytes this job tested. The asar
      # travels with it so the hash comparison needs no build of its own.
      - name: Upload the built installer for the installed-copy job
        uses: actions/upload-artifact@v4
        with:
          name: installer-bytes
          path: |
            release/*.exe
            release/win-unpacked/resources/app.asar
          if-no-files-found: error

      # Uses the package built above: seeds a throwaway profile, drives
      # release/win-unpacked/JOYFRAME.exe with the virtual pad, and refuses to
      # run unless the asar matches the current out/.
      - name: Controller suite against the packaged build
        id: packaged-controller
        timeout-minutes: 5
        env:
          # Both artifacts this job uploads when the packaged suite fails.
          JF_FAILURE_ARTIFACTS: controller-suite-packaged-artifacts-attempt-${{ github.run_attempt }},installer-build-log-attempt-${{ github.run_attempt }}
        run: npm run verify:dist-pad

      - name: Upload packaged controller screenshots and app log
        if: failure() && steps.packaged-controller.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: controller-suite-packaged-artifacts-attempt-${{ github.run_attempt }}
          path: |
            .verify-shots
            .verify-logs/verify-dist-pad.log
          if-no-files-found: warn
          # The screenshots live under a dot-directory, which upload-artifact
          # skips unless this is on.
          include-hidden-files: true

      # The package from above is already fresh; these cover its demo and ROM
      # payloads, the 1.0.0 upgrade path and a clean first launch without
      # another build.
      - name: Packaged app — demo, ROM and 1.0.0 profiles
        id: dist-profiles
        timeout-minutes: 5
        env:
          # Both artifacts this job uploads when the profile probe fails.
          JF_FAILURE_ARTIFACTS: dist-profiles-artifacts-attempt-${{ github.run_attempt }},installer-build-log-attempt-${{ github.run_attempt }}
        run: npm run verify:dist

      - name: Upload packaged profile artifacts
        if: failure() && steps.dist-profiles.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: dist-profiles-artifacts-attempt-${{ github.run_attempt }}
          path: .verify-logs/verify-dist.log
          if-no-files-found: warn
          include-hidden-files: true

      - name: Packaged app — first run
        id: first-run
        timeout-minutes: 3
        env:
          JF_FAILURE_ARTIFACTS: first-run-artifacts-attempt-${{ github.run_attempt }},installer-build-log-attempt-${{ github.run_attempt }}
        run: npm run verify:first-run

      - name: Upload first-run artifacts
        if: failure() && steps.first-run.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: first-run-artifacts-attempt-${{ github.run_attempt }}
          path: .verify-logs/verify-first-run.log
          if-no-files-found: warn
          include-hidden-files: true

      # Both input paths on the welcome name step once broke in opposite ways:
      # a pad had no way forward, and typing was swallowed as a skip. This
      # packaged probe proves each path against the shipped payload.
      - name: Packaged app — welcome name step
        id: intro-name-pad
        timeout-minutes: 3
        run: npm run verify:intro-name-pad

      # The welcome step above covers the name field only, so the intro dropdown
      # was the one packaged surface no probe drove here: a mode that stopped
      # persisting would have shipped unnoticed. `JOYFRAME_EXE` is what makes
      # this probe drive release/win-unpacked instead of dev Electron.
      - name: Packaged app — intro dropdown modes
        id: intro-ui
        timeout-minutes: 3
        env:
          JOYFRAME_EXE: release/win-unpacked/JOYFRAME.exe
          JF_FAILURE_ARTIFACTS: intro-ui-artifacts-attempt-${{ github.run_attempt }},installer-build-log-attempt-${{ github.run_attempt }}
        run: npm run verify:intro-ui

      - name: Upload intro-ui artifacts
        if: failure() && steps.intro-ui.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: intro-ui-artifacts-attempt-${{ github.run_attempt }}
          path: .verify-logs/verify-intro-ui.log
          if-no-files-found: warn
          include-hidden-files: true

      # Runs last on purpose: failure() here covers the build, the icon check
      # and every packaged suite, while an upload placed after the build
      # could never see the later ones. dist.log is their shared context.
      - name: Upload installer build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-build-log-attempt-${{ github.run_attempt }}
          path: dist.log
          if-no-files-found: warn

  # The only probe that drives the machine-wide copy, and the only one that
  # needs an install. It takes the package the installer job built and passed
  # the packaged suites, installs it silently the way a release machine does,
  # then runs the same command a release engineer runs: the installed asar must
  # be byte-for-byte release/win-unpacked, and the copy must boot, show the
  # ident, skip it on a key press without activating the app underneath, and
  # honour `introMode: off` on a cold first launch.
  installed-checks:
    name: installed copy boots and skips its intro
    runs-on: windows-latest
    needs: [installer]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # No `npm ci`: both scripts behind `npm run verify:installed` import only
      # `node:` modules and their sibling helpers, so Electron's postinstall
      # download would add nothing to a check that never boots the workspace
      # build. A future dependency there fails loudly with MODULE_NOT_FOUND.
      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Download the built installer
        uses: actions/download-artifact@v4
        with:
          name: installer-bytes
          path: release

      - name: Install it silently, the way a release machine does
        id: install
        shell: pwsh
        timeout-minutes: 5
        run: |
          $installer = Get-ChildItem release -Filter 'JOYFRAME Setup *.exe' | Select-Object -First 1
          if (-not $installer) { throw 'release/ holds no installer — the installer job uploaded none' }
          Write-Host "installing $($installer.Name)"
          $result = Start-Process -FilePath $installer.FullName -ArgumentList '/allusers', '/S' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "$($installer.Name) exited $($result.ExitCode)" }
          # A silent assisted install can still honour its run-after-finish box.
          # Stop that copy so the probe's own launch owns its profile.
          Get-Process JOYFRAME -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = 'C:\Program Files\JOYFRAME\JOYFRAME.exe'
          $deadline = (Get-Date).AddSeconds(60)
          while (-not (Test-Path $exe) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path $exe)) { throw "the installer left no $exe" }
          Write-Host "installed $exe"

      # The hash runs before anything launches, so a partial or stale install
      # fails on the bytes instead of as a probe that never found its window.
      - name: Installed app — intro, skip and cold start
        id: installed
        timeout-minutes: 5
        run: npm run verify:installed

      # One path is not a matrix: a per-user install landing in Program Files,
      # an uninstaller wiping %APPDATA%/JOYFRAME, or a version mismatch would
      # all stay green. This runs the per-user / uninstall / downgrade half
      # here, where the all-users copy already exists to assert against — no
      # elevation needed, it only adds and removes its own marker file inside
      # the real profile directory and never deletes user data.
      - name: Installer matrix — per-user, uninstall and downgrade paths
        id: installer-matrix
        timeout-minutes: 8
        env:
          JF_FAILURE_ARTIFACTS: installer-matrix-artifacts-attempt-${{ github.run_attempt }}
        run: npm run verify:installer-matrix

      - name: Upload installer-matrix artifacts
        if: failure() && steps.installer-matrix.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: installer-matrix-artifacts-attempt-${{ github.run_attempt }}
          path: .verify-logs/verify-installer-matrix.log
          if-no-files-found: warn
          include-hidden-files: true

      - name: Upload installed-copy artifacts
        if: failure() && steps.installed.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: installed-copy-artifacts-attempt-${{ github.run_attempt }}
          path: |
            .verify-logs/verify-installed.log
            .verify-intro
          if-no-files-found: warn
          # Both paths live under dot-directories, which upload-artifact skips
          # unless this is on.
          include-hidden-files: true
